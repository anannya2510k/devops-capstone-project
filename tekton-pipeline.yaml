
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-ci
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        git clone --branch "$(params.revision)" \
          "$(params.repo-url)" "$(workspaces.source.path)"
    - name: lint-and-test
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        set -eu
        export PYTHONPATH="$(workspaces.source.path):${PYTHONPATH:-}"
        python -m pip install --no-cache-dir -r requirements.txt flake8 pytest
        flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m pytest -v
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-ci-pipeline
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  tasks:
    - name: test-project
      taskRef:
        name: accounts-ci
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: accounts-ci-run
spec:
  pipelineRef:
    name: accounts-ci-pipeline
  params:
    - name: repo-url
      value: https://github.com/anannya2510k/devops-capstone-project.git
    - name: revision
      value: main
  workspaces:
    - name: source
      emptyDir: {}
